
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradeLog Pro</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:#f8fafc;
      color:#0f172a;
      overflow-x:hidden;
    }

    :root{
      --blue:#2563eb;
      --blue-dark:#1d4ed8;
      --green:#10b981;
      --red:#ef4444;
      --border:#e2e8f0;
      --gray:#64748b;
      --card:#ffffff;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:24px;
    }

    .card{
      background:white;
      border-radius:18px;
      border:1px solid var(--border);
      padding:20px;
      box-shadow:0 4px 14px rgba(0,0,0,0.05);
    }

    .btn{
      border:none;
      border-radius:10px;
      padding:12px 18px;
      cursor:pointer;
      font-weight:700;
      transition:0.2s;
      font-family:'DM Sans',sans-serif;
    }

    .btn-primary{
      background:linear-gradient(135deg,var(--blue),var(--blue-dark));
      color:white;
    }

    .btn-secondary{
      background:#eef2ff;
      color:var(--blue);
    }

    .btn:hover{
      opacity:0.92;
    }

    .input{
      width:100%;
      border:1.5px solid var(--border);
      border-radius:10px;
      padding:12px;
      outline:none;
      font-size:14px;
    }

    .input:focus{
      border-color:var(--blue);
    }

    .grid{
      display:grid;
      gap:16px;
    }

    .stats-grid{
      grid-template-columns:repeat(4,1fr);
    }

    .trade-grid{
      grid-template-columns:repeat(5,1fr);
    }

    .login-wrapper{
      min-height:100vh;
      display:flex;
    }

    .login-left{
      width:420px;
      background:linear-gradient(135deg,#1d4ed8,#2563eb);
      color:white;
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .login-right{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .profile-name{
      font-family:'Sora',sans-serif;
      font-size:28px;
      font-weight:700;
      line-height:1.3;
      word-break:break-word;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      min-width:700px;
      border-collapse:collapse;
    }

    th,td{
      padding:14px;
      border-bottom:1px solid #f1f5f9;
      text-align:left;
    }

    .positive{
      color:var(--green);
      font-weight:700;
    }

    .negative{
      color:var(--red);
      font-weight:700;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    @media(max-width:768px){

      .container{
        padding:14px;
      }

      .login-wrapper{
        flex-direction:column;
      }

      .login-left{
        width:100%;
        padding:30px 20px;
      }

      .stats-grid,
      .trade-grid{
        grid-template-columns:1fr;
      }

      .profile-name{
        font-size:20px;
      }

      .card{
        padding:16px;
      }

      h1{
        font-size:26px !important;
      }
    }

  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {useState,useMemo} = React;

function Button({children,className='',...props}){
  return(
    <button className={`btn ${className}`} {...props}>
      {children}
    </button>
  )
}

function Input(props){
  return <input className="input" {...props}/>
}

function LoginPage({onLogin}){

  const[email,setEmail] = useState('');
  const[password,setPassword] = useState('');

  return(
    <div className="login-wrapper">

      <div className="login-left">

        <h1 style={{
          fontFamily:'Sora',
          fontSize:40,
          fontWeight:700,
          marginBottom:20
        }}>
          TradeLog Pro
        </h1>

        <p style={{
          lineHeight:1.8,
          opacity:0.85
        }}>
          Track your trading performance with a clean and professional dashboard.
        </p>

      </div>

      <div className="login-right">

        <div className="card" style={{
          width:'100%',
          maxWidth:420
        }}>

          <h2 style={{
            fontFamily:'Sora',
            marginBottom:20
          }}>
            Sign In
          </h2>

          <div style={{
            display:'flex',
            flexDirection:'column',
            gap:14
          }}>

            <Input
              type="email"
              placeholder="Email Address"
              value={email}
              onChange={(e)=>setEmail(e.target.value)}
            />

            <Input
              type="password"
              placeholder="Password"
              value={password}
              onChange={(e)=>setPassword(e.target.value)}
            />

            <Button
              className="btn-primary"
              onClick={onLogin}
            >
              Login
            </Button>

          </div>

        </div>

      </div>

    </div>
  )
}

function ProfileModal({profile,onClose,onSave}){

  const[name,setName] = useState(profile.full_name);

  return(
    <div style={{
      position:'fixed',
      inset:0,
      background:'rgba(0,0,0,0.45)',
      display:'flex',
      alignItems:'center',
      justifyContent:'center',
      zIndex:1000,
      padding:20
    }}>

      <div className="card" style={{
        width:'100%',
        maxWidth:420
      }}>

        <h2 style={{
          fontFamily:'Sora',
          marginBottom:20
        }}>
          Edit Profile
        </h2>

        <Input
          value={name}
          maxLength={50}
          onChange={(e)=>setName(e.target.value)}
        />

        <div style={{
          display:'flex',
          gap:10,
          marginTop:20
        }}>

          <Button
            className="btn-secondary"
            onClick={onClose}
          >
            Cancel
          </Button>

          <Button
            className="btn-primary"
            onClick={()=>onSave(name)}
          >
            Save
          </Button>

        </div>

      </div>

    </div>
  )
}

function Dashboard(){

  const[showModal,setShowModal] = useState(false);

  const[profile,setProfile] = useState({
    full_name:'Towsif Ahmed Rahman'
  });

  const[trades,setTrades] = useState([
    {ticker:'BTC',direction:'LONG',result:240},
    {ticker:'ETH',direction:'SHORT',result:-120},
    {ticker:'SOL',direction:'LONG',result:410}
  ]);

  const[ticker,setTicker] = useState('');
  const[direction,setDirection] = useState('');
  const[result,setResult] = useState('');

  const totalPnl = useMemo(()=>{
    return trades.reduce((sum,t)=>sum+t.result,0);
  },[trades]);

  const addTrade = ()=>{

    if(!ticker || !direction || !result){
      return;
    }

    setTrades(prev=>[
      {
        ticker:ticker.toUpperCase(),
        direction,
        result:Number(result)
      },
      ...prev
    ]);

    setTicker('');
    setDirection('');
    setResult('');
  }

  return(
    <div className="container">

      <div className="topbar">

        <div>
          <h1 style={{
            fontFamily:'Sora',
            fontSize:32
          }}>
            Dashboard
          </h1>

          <div style={{
            marginTop:6,
            color:'#64748b'
          }}>
            Trading performance overview
          </div>
        </div>

        <Button className="btn-secondary">
          Logout
        </Button>

      </div>

      <div className="card">

        <div style={{
          display:'flex',
          justifyContent:'space-between',
          alignItems:'center',
          gap:20,
          flexWrap:'wrap'
        }}>

          <div style={{
            display:'flex',
            alignItems:'center',
            gap:16,
            flex:1,
            minWidth:0
          }}>

            <div style={{
              width:70,
              height:70,
              borderRadius:'50%',
              background:'#2563eb',
              color:'white',
              display:'flex',
              alignItems:'center',
              justifyContent:'center',
              fontWeight:700,
              fontSize:24,
              flexShrink:0
            }}>
              {profile.full_name.charAt(0)}
            </div>

            <div style={{
              flex:1,
              minWidth:0
            }}>
              <div className="profile-name">
                {profile.full_name}
              </div>

              <div style={{
                color:'#64748b',
                marginTop:6
              }}>
                Professional Trader
              </div>
            </div>

          </div>

          <Button
            className="btn-primary"
            onClick={()=>setShowModal(true)}
          >
            Edit Name
          </Button>

        </div>

      </div>

      <div className="grid stats-grid" style={{
        marginTop:20
      }}>

        <div className="card">

          <div style={{
            color:'#64748b',
            marginBottom:8
          }}>
            Total Trades
          </div>

          <h2 style={{
            fontFamily:'Sora'
          }}>
            {trades.length}
          </h2>

        </div>

        <div className="card">

          <div style={{
            color:'#64748b',
            marginBottom:8
          }}>
            Total PNL
          </div>

          <h2
            className={totalPnl >=0 ? 'positive':'negative'}
            style={{
              fontFamily:'Sora'
            }}
          >
            ${totalPnl}
          </h2>

        </div>

        <div className="card">

          <div style={{
            color:'#64748b',
            marginBottom:8
          }}>
            Win Rate
          </div>

          <h2 style={{
            fontFamily:'Sora'
          }}>
            64%
          </h2>

        </div>

        <div className="card">

          <div style={{
            color:'#64748b',
            marginBottom:8
          }}>
            Best Trade
          </div>

          <h2 style={{
            fontFamily:'Sora'
          }}>
            $410
          </h2>

        </div>

      </div>

      <div className="card" style={{
        marginTop:20
      }}>

        <h2 style={{
          fontFamily:'Sora',
          marginBottom:20
        }}>
          Add Trade
        </h2>

        <div className="grid trade-grid">

          <Input
            placeholder="Ticker"
            value={ticker}
            onChange={(e)=>setTicker(e.target.value)}
          />

          <Input
            placeholder="Direction"
            value={direction}
            onChange={(e)=>setDirection(e.target.value)}
          />

          <Input
            placeholder="Result"
            type="number"
            value={result}
            onChange={(e)=>setResult(e.target.value)}
          />

          <div></div>

          <Button
            className="btn-primary"
            onClick={addTrade}
          >
            Add Trade
          </Button>

        </div>

      </div>

      <div className="card" style={{
        marginTop:20
      }}>

        <h2 style={{
          fontFamily:'Sora',
          marginBottom:20
        }}>
          Trade History
        </h2>

        <div className="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Ticker</th>
                <th>Direction</th>
                <th>Result</th>
              </tr>
            </thead>

            <tbody>

              {trades.map((trade,index)=>(
                <tr key={index}>

                  <td>{trade.ticker}</td>

                  <td>{trade.direction}</td>

                  <td className={trade.result >=0 ? 'positive':'negative'}>
                    ${trade.result}
                  </td>

                </tr>
              ))}

            </tbody>

          </table>

        </div>

      </div>

      {showModal && (

        <ProfileModal
          profile={profile}
          onClose={()=>setShowModal(false)}
          onSave={(name)=>{

            setProfile(prev=>({
              ...prev,
              full_name:name
            }));

            setShowModal(false);

          }}
        />

      )}

    </div>
  )
}

function App(){

  const[loggedIn,setLoggedIn] = useState(false);

  if(!loggedIn){
    return(
      <LoginPage
        onLogin={()=>setLoggedIn(true)}
      />
    )
  }

  return <Dashboard/>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
