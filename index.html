const dbFetch = async (path, method="GET", body=null, token=null, extra={}) => {
  const headers = {"Content-Type":"application/json","apikey":SUPABASE_KEY,...extra};
  if (token) headers["Authorization"]=`Bearer ${token}`;
  const res = await fetch(`${SUPABASE_URL}${path}`,{method,headers,body:body?JSON.stringify(body):null});
  if (!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||e.error_description||"Failed");}
  const t=await res.text(); return t?JSON.parse(t):null;
};
const authFetch = async (path,body) => {
  const res=await fetch(`${SUPABASE_URL}/auth/v1${path}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(body)});
  const d=await res.json(); if(!res.ok) throw new Error(d.error_description||d.msg||"Auth failed"); return d;
};
const upsert=(path,body,token)=>dbFetch(`/rest/v1/${path}`,"POST",body,token,{"Prefer":"resolution=merge-duplicates,return=representation"});

// ── AUTH ──────────────────────────────────────────────────────
function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [fullName,setFullName]=useState("");
  const [birthday,setBirthday]=useState("");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  const sw=m=>{setMode(m);setError("");setSuccess("");};

  const handle=async()=>{
    setError("");setSuccess("");
    if(!email||!password){setError("Enter email and password.");return;}
    if(password.length<6){setError("Password must be at least 6 characters.");return;}
    if(mode==="signup"&&!fullName.trim()){setError("Enter your full name.");return;}
    if(mode==="signup"&&!birthday){setError("Enter your birthday.");return;}
    setLoading(true);
    try{
      if(mode==="login"){
        const d=await authFetch("/token?grant_type=password",{email,password});
        onLogin(d.access_token,d.user);
      } else {
        const d=await authFetch("/signup",{email,password});
        if(d.access_token&&d.user?.id){
          await upsert("profiles",{user_id:d.user.id,full_name:fullName.trim(),birthday},d.access_token);
          onLogin(d.access_token,d.user);
        } else {setSuccess("Account created! Please sign in.");sw("login");}
      }
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8eeff,#f5f8ff,#dce8ff)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Plus Jakarta Sans',sans-serif",padding:"24px"}}>
      <style>{STYLES}</style>
      <div style={{background:"#fff",borderRadius:24,border:"1px solid #dce6ff",boxShadow:"0 8px 48px rgba(30,80,220,0.12)",padding:"44px 40px",width:"100%",maxWidth:440,animation:"fadeUp 0.4s ease both"}}>
        <div style={{textAlign:"center",marginBottom:30}}>
          <div style={{width:52,height:52,background:"linear-gradient(135deg,#2145e6,#0f2aab)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:"#fff",margin:"0 auto 14px"}}>◈</div>
          <div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:"#0f1a3a"}}>TradeLog</div>
          <div style={{fontSize:13,color:"#aab8e0",marginTop:5}}>{mode==="login"?"Welcome back! Sign in to continue":"Create your TradeLog account"}</div>
        </div>
        {error&&<div style={{background:"#fff0f3",border:"1px solid #ffc5cf",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#e02044",marginBottom:16,fontWeight:600}}>{error}</div>}
        {success&&<div style={{background:"#e8fff3",border:"1px solid #a3f0c8",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#0ea55a",marginBottom:16,fontWeight:600}}>{success}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          {mode==="signup"&&<>
            <div>{lbl("Full Name")}<input type="text" placeholder="e.g. Towfiq Ahmed" value={fullName} onChange={e=>setFullName(e.target.value)}/></div>
            <div>{lbl("Birthday")}<input type="date" value={birthday} onChange={e=>setBirthday(e.target.value)}/></div>
          </>}
          <div>{lbl("Email")}<input type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/></div>
          <div>{lbl("Password")}<input type="password" placeholder="Min. 6 characters" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/></div>
          <button className="btn-blue" onClick={handle} disabled={loading} style={{marginTop:4}}>{loading?"Please wait…":mode==="login"?"Sign In":"Create Account"}</button>
        </div>
        <div style={{textAlign:"center",marginTop:20,fontSize:13,color:"#aab8e0"}}>
          {mode==="login"?"Don't have an account? ":"Already have an account? "}
          <span onClick={()=>sw(mode==="login"?"signup":"login")} style={{color:"#2145e6",fontWeight:700,cursor:"pointer"}}>{mode==="login"?"Sign Up":"Sign In"}</span>
        </div>
      </div>
    </div>
  );
}

// ── BINANCE CALCULATOR PAGE ───────────────────────────────────
function CalcPage(){
  const [dir,setDir]=useState("long");
  const [entry,setEntry]=useState("");
  const [margin,setMargin]=useState("");
  const [leverage,setLeverage]=useState(20);
  const [tpPct,setTpPct]=useState("");
  const [slPct,setSlPct]=useState("");
  const [bdtRate,setBdtRate]=useState(110);
  const [mm,setMm]=useState(0.5);

  const calc=useMemo(()=>{
    const e=parseFloat(entry),m=parseFloat(margin),lev=parseFloat(leverage),tp=parseFloat(tpPct),sl=parseFloat(slPct),bdt=parseFloat(bdtRate),mmR=parseFloat(mm);
    if(!e||!m||!lev) return null;
    const posSize=m*lev;
    const qty=posSize/e;
    const fee=posSize*0.001;
    // TP
    let tpPrice=null,tpGross=null,tpNet=null,tpRetPct=null;
    if(tp){
      const priceMov=tp/lev;
      tpPrice=dir==="long"?e*(1+priceMov/100):e*(1-priceMov/100);
      tpGross=m*(tp/100);
      tpNet=tpGross-fee;
      tpRetPct=(tpNet/m)*100;
    }
    // SL
    let slPrice=null,slGross=null,slNet=null,slRetPct=null;
    if(sl){
      const priceMov=sl/lev;
      slPrice=dir==="long"?e*(1-priceMov/100):e*(1+priceMov/100);
      slGross=-(m*(sl/100));
      slNet=slGross-fee;
      slRetPct=(slNet/m)*100;
    }
    // Liquidation
    const liqPrice=dir==="long"?e*(1-1/lev+mmR/100):e*(1+1/lev-mmR/100);
    // RR
    let rr="-";
    if(tp&&sl) rr=`1 : ${(tp/sl).toFixed(2)}`;
    return{posSize,qty,liqPrice,tpPrice,tpGross,tpNet,tpRetPct,slPrice,slGross,slNet,slRetPct,rr,bdt,fee};
  },[dir,entry,margin,leverage,tpPct,slPct,bdtRate,mm]);

  const applyRatio=()=>{
    const s=parseFloat(slPct);
    if(s>0){setTpPct((s*3).toFixed(2));return;}
    const t=parseFloat(tpPct);
    if(t>0) setSlPct((t/3).toFixed(2));
  };

  const fN=(n,d=2)=>n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:d});
  const fP=(n)=>n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:6});

  return(
    <div style={{background:"#0b0e11",minHeight:"100vh",padding:"24px",fontFamily:"'Plus Jakarta Sans',sans-serif"}}>
      <div style={{maxWidth:1000,margin:"0 auto"}}>
        <h2 style={{textAlign:"center",color:"#f0b90b",fontFamily:"'Instrument Serif',serif",fontSize:26,marginBottom:6}}>⚡ Binance Futures PnL Calculator</h2>
        <p style={{textAlign:"center",color:"#848e9c",marginBottom:24,fontSize:13}}>Input PnL % on Margin → Get Platform Price, Gross & Net PnL, BDT</p>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
          {/* LEFT — Inputs */}
          <div className="calc-card">
            <div style={{fontWeight:700,color:"#eaecef",marginBottom:16,fontSize:15}}>📊 Trade Setup</div>

            {/* Direction */}
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <button className={`dir-btn ${dir==="long"?"long-active":""}`} onClick={()=>setDir("long")}>LONG</button>
              <button className={`dir-btn ${dir==="short"?"short-active":""}`} onClick={()=>setDir("short")}>SHORT</button>
            </div>

            {[["Entry Price (USDT)",entry,setEntry,"e.g. 65000"],["Initial Margin (USDT)",margin,setMargin,"e.g. 100"]].map(([l,v,s,p])=>(
              <div key={l} style={{marginBottom:14}}>
                <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>{l}</label>
                <input type="number" className="calc-input" placeholder={p} value={v} onChange={e=>s(e.target.value)}/>
              </div>
            ))}

            <div style={{marginBottom:14}}>
              <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>Leverage</label>
              <div style={{textAlign:"center",fontSize:20,fontWeight:700,color:"#f0b90b",marginBottom:6}}>{leverage}x</div>
              <input type="range" min="1" max="125" value={leverage} onChange={e=>setLeverage(e.target.value)}/>
            </div>

            {/* RR Box */}
            <div style={{background:"rgba(240,185,11,0.1)",border:"1px solid #f0b90b",borderRadius:8,padding:"11px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:13,color:"#f0b90b"}}>⚠️ Recommended R:R = 1:3</span>
              <button onClick={applyRatio} style={{background:"#f0b90b",color:"#000",border:"none",padding:"6px 14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>Auto Fix</button>
            </div>

            {[["Target PnL % (Return on Margin)",tpPct,setTpPct,"e.g. 150"],["Max Loss % (Risk on Margin)",slPct,setSlPct,"e.g. 50"],["USDT to BDT Rate",bdtRate,setBdtRate,"e.g. 110"],["Maintenance Margin (%)",mm,setMm,"0.5"]].map(([l,v,s,p])=>(
              <div key={l} style={{marginBottom:14}}>
                <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>{l}</label>
                <input type="number" className="calc-input" placeholder={p} value={v} onChange={e=>s(e.target.value)}/>
              </div>
            ))}
          </div>

          {/* RIGHT — Results */}
          <div className="calc-card">
            <div style={{fontWeight:700,color:"#eaecef",marginBottom:16,fontSize:15}}>📈 Position Details</div>

            {[["Direction",<span style={{color:dir==="long"?"#0ecb81":"#f6465d",fontWeight:700}}>{dir.toUpperCase()}</span>],
              ["Position Size",calc?`${fN(calc.posSize)} USDT`:"—"],
              ["Quantity (Coins)",calc?fN(calc.qty,6):"—"],
              ["Risk/Reward Ratio",calc?calc.rr:"—"],
            ].map(([l,v])=>(
              <div key={l} className="res-row"><span style={{color:"#848e9c",fontSize:14}}>{l}</span><span style={{fontWeight:700,fontSize:14,color:"#eaecef"}}>{v}</span></div>
            ))}

            <div className="liq-banner">
              <span style={{fontSize:13,color:"#f6465d",fontWeight:700}}>💧 Liquidation Price</span>
              <span style={{fontSize:18,fontWeight:700,color:"#f6465d",fontFamily:"monospace"}}>{calc?fP(calc.liqPrice):"—"}</span>
            </div>

            {/* TP */}
            <div className="scen-tp">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:"#0ecb81",fontWeight:700,textTransform:"uppercase",fontSize:13}}>🎯 Take Profit</span>
                <span style={{color:"#f0b90b",fontWeight:700,fontSize:13}}>{tpPct?`${(tpPct/leverage).toFixed(3)}% move`:"—"}</span>
              </div>
              <div className="plat-price">
                <div style={{fontSize:11,color:"#f0b90b",textTransform:"uppercase",letterSpacing:0.5}}>Platform Price (Set on Binance)</div>
                <div style={{fontSize:20,fontWeight:700,color:"#f0b90b",fontFamily:"monospace"}}>{calc&&calc.tpPrice?fP(calc.tpPrice):"—"}</div>
              </div>
              {[["Gross PnL",calc&&calc.tpGross!=null?`+${fN(calc.tpGross)} USDT`:"—","#0ecb81"],
                ["Net PnL (after fees)",calc&&calc.tpNet!=null?`+${fN(calc.tpNet)} USDT`:"—","#0ecb81"],
                ["Return on Margin",calc&&calc.tpRetPct!=null?`+${fN(calc.tpRetPct)}%`:"—","#0ecb81"],
              ].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:13}}>
                  <span style={{color:"#848e9c"}}>{l}</span><span style={{fontWeight:700,color:c,fontFamily:"monospace"}}>{v}</span>
                </div>
              ))}
              {calc&&calc.tpNet&&<div style={{fontSize:11,color:"#848e9c",textAlign:"right",marginTop:4}}>{fN(calc.tpNet*bdtRate)} BDT</div>}
            </div>

            {/* SL */}
            <div className="scen-sl">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:"#f6465d",fontWeight:700,textTransform:"uppercase",fontSize:13}}>🛑 Stop Loss</span>
                <span style={{color:"#f0b90b",fontWeight:700,fontSize:13}}>{slPct?`${(slPct/leverage).toFixed(3)}% move`:"—"}</span>
              </div>
              <div className="plat-price">
                <div style={{fontSize:11,color:"#f0b90b",textTransform:"uppercase",letterSpacing:0.5}}>Platform Price (Set on Binance)</div>
                <div style={{fontSize:20,fontWeight:700,color:"#f0b90b",fontFamily:"monospace"}}>{calc&&calc.slPrice?fP(calc.slPrice):"—"}</div>
              </div>
              {[["Gross PnL",calc&&calc.slGross!=null?`${fN(calc.slGross)} USDT`:"—","#f6465d"],
                ["Net PnL (after fees)",calc&&calc.slNet!=null?`${fN(calc.slNet)} USDT`:"—","#f6465d"],
                ["Return on Margin",calc&&calc.slRetPct!=null?`${fN(calc.slRetPct)}%`:"—","#f6465d"],
              ].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:13}}>
                  <span style={{color:"#848e9c"}}>{l}</span><span style={{fontWeight:700,color:c,fontFamily:"monospace"}}>{v}</span>
                </div>
              ))}
              {calc&&calc.slNet&&<div style={{fontSize:11,color:"#848e9c",textAlign:"right",marginTop:4}}>{fN(calc.slNet*bdtRate)} BDT</div>}
            </div>

            <div style={{fontSize:11,color:"#848e9c",textAlign:"center",marginTop:10,fontStyle:"italic"}}>*Fees estimated at 0.1% round-trip on Position Size</div>
          </div>
        </div>

        <div style={{background:"#1e2329",border:"1px solid #2b3139",borderRadius:12,padding:"14px 18px",marginTop:20,fontSize:12,color:"#848e9c",lineHeight:1.7}}>
          <strong style={{color:"#eaecef"}}>How the math works:</strong> PnL % on Margin (e.g. 100% = double your margin) → Price Move % = PnL % ÷ Leverage → Platform Price = Entry × (1 ± Price Move %) → Gross PnL = Margin × (PnL% / 100) → Net PnL = Gross − Fees.<br/>
          <em>Disclaimer: Educational estimate. Actual Binance fees, funding, and margin tiers may vary.</em>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD PAGE ────────────────────────────────────────────
function Dashboard({token,profile,onLogout,downloadCSV}){
  const [trades,setTrades]=useState([]);
  const [startCap,setStartCap]=useState(10000);
  const [capEdit,setCapEdit]=useState(false);
  const [capInput,setCapInput]=useState("");
  const [loadingData,setLoadingData]=useState(false);
  const [date,setDate]=useState(todayStr());
  const [ticker,setTicker]=useState("");
  const [result,setResult]=useState("");
  const [note,setNote]=useState("");
  const [formError,setFormError]=useState("");
  const [saving,setSaving]=useState(false);
  const [expandedDay,setExpandedDay]=useState(null);
  const [activeTab,setActiveTab]=useState("log");

  const fetchData=useCallback(async()=>{
    if(!token)return;
    setLoadingData(true);
    try{
      const [td,sd]=await Promise.all([
        dbFetch("/rest/v1/trades?select=*&order=date.desc,created_at.desc","GET",null,token),
        dbFetch("/rest/v1/user_settings?select=*","GET",null,token),
      ]);
      setTrades(td||[]);
      if(sd?.length>0)setStartCap(sd[0].starting_capital);
    }catch(e){console.error(e);}
    finally{setLoadingData(false);}
  },[token]);

  useEffect(()=>{fetchData();},[fetchData]);

  const addTrade=async()=>{
    const r=parseFloat(result);
    if(isNaN(r)){setFormError("Enter a valid result.");return;}
    if(!date){setFormError("Pick a date.");return;}
    setFormError("");setSaving(true);
    try{
      const uid=JSON.parse(atob(token.split(".")[1])).sub;
      const row=await dbFetch("/rest/v1/trades","POST",{user_id:uid,date,ticker:ticker.trim().toUpperCase(),result:r,note:note.trim()},token,{"Prefer":"return=representation"});
      setTrades(prev=>[row[0],...prev]);
      setTicker("");setResult("");setNote("");
    }catch(e){setFormError(e.message);}
    finally{setSaving(false);}
  };

  const deleteTrade=async(id)=>{
    try{await dbFetch(`/rest/v1/trades?id=eq.${id}`,"DELETE",null,token);setTrades(prev=>prev.filter(t=>t.id!==id));}
    catch(e){alert("Delete failed: "+e.message);}
  };

  const saveCapital=async()=>{
    const v=parseFloat(capInput);
    if(isNaN(v)||v<=0)return;
    try{
      const uid=JSON.parse(atob(token.split(".")[1])).sub;
      await upsert("user_settings",{user_id:uid,starting_capital:v},token);
      setStartCap(v);setCapEdit(false);
    }catch(e){alert("Could not save: "+e.message);}
  };

  const days=useMemo(()=>{
    const map={};
    trades.forEach(t=>{if(!map[t.date])map[t.date]={date:t.date,trades:[],total:0};map[t.date].trades.push(t);map[t.date].total+=parseFloat(t.result);});
    return Object.values(map).sort((a,b)=>b.date.localeCompare(a.date));
  },[trades]);

  const totalPNL=days.reduce((s,d)=>s+d.total,0);
  const currentCap=startCap+totalPNL;
  const capPct=((currentCap-startCap)/startCap*100);
  const winDays=days.filter(d=>d.total>0).length;
  const lossDays=days.filter(d=>d.total<0).length;
  const winRate=days.length?(winDays/days.length*100).toFixed(1):"0.0";
  const best=days.length?Math.max(...days.map(d=>d.total)):0;
  const worst=days.length?Math.min(...days.map(d=>d.total)):0;
  const chartDays=[...days].reverse().slice(-12);
  const maxAbs=Math.max(...chartDays.map(d=>Math.abs(d.total)),1);

  return(
    <div style={{maxWidth:1020,margin:"0 auto",padding:"24px",display:"flex",flexDirection:"column",gap:20}}>
      {loadingData&&<div style={{textAlign:"center",padding:"40px",color:"#aab8e0"}}>Loading your trades…</div>}
      {!loadingData&&<>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14}} className="fade-up">
          <div style={{background:"linear-gradient(135deg,#1a3fd4,#0f2aab)",borderRadius:18,color:"#fff",padding:"24px 26px"}}>
            <div style={{fontSize:11,letterSpacing:1,opacity:0.55,fontWeight:600,textTransform:"uppercase",marginBottom:8}}>Current Capital</div>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:32,letterSpacing:"-1px",lineHeight:1}}>{fmt(currentCap)}</div>
            <div style={{marginTop:10}}><span style={{fontSize:12,background:capPct>=0?"rgba(255,255,255,0.18)":"rgba(255,60,80,0.3)",borderRadius:7,padding:"4px 10px",fontWeight:700}}>{capPct>=0?"▲":"▼"} {Math.abs(capPct).toFixed(2)}%</span></div>
            <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.12)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:10,opacity:0.5,textTransform:"uppercase"}}>Starting</div><div style={{fontWeight:700,fontSize:15,marginTop:2}}>{fmt(startCap)}</div></div>
              <button onClick={()=>{setCapEdit(!capEdit);setCapInput(startCap.toString());}} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:11,fontFamily:"inherit",fontWeight:700}}>{capEdit?"CANCEL":"EDIT"}</button>
            </div>
            {capEdit&&<div style={{marginTop:10,display:"flex",gap:8}}><input type="number" value={capInput} onChange={e=>setCapInput(e.target.value)} placeholder="New starting capital" style={{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.25)",color:"#fff",flex:1}}/><button onClick={saveCapital} style={{background:"#fff",color:"#1a3fd4",border:"none",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>SAVE</button></div>}
          </div>
          <div className="card" style={{padding:"22px"}}><label style={{fontSize:11,color:"#8fa4d4",letterSpacing:0.8,textTransform:"uppercase",fontWeight:600,display:"block",marginBottom:6}}>Total PNL</label><div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:totalPNL>=0?"#0ea55a":"#e02044"}}>{totalPNL>=0?"+":""}{fmt(totalPNL)}</div><div style={{marginTop:8,fontSize:12,color:"#aab8e0"}}>{trades.length} trades · {days.length} days</div></div>
          <div className="card" style={{padding:"22px"}}><label style={{fontSize:11,color:"#8fa4d4",letterSpacing:0.8,textTransform:"uppercase",fontWeight:600,display:"block",marginBottom:6}}>Day Win Rate</label><div style={{fontFamily:"'Instrument Serif',serif",fontSize:28}}>{winRate}%</div><div style={{marginTop:8,display:"flex",gap:10}}><span style={{fontSize:13,color:"#0ea55a",fontWeight:700}}>▲ {winDays}W</span><span style={{fontSize:13,color:"#e02044",fontWeight:700}}>▼ {lossDays}L</span></div></div>
          <div className="card" style={{padding:"22px"}}><label style={{fontSize:11,color:"#8fa4d4",letterSpacing:0.8,textTransform:"uppercase",fontWeight:600,display:"block",marginBottom:6}}>Best / Worst Day</label><div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,color:"#0ea55a"}}>+{fmt(best)}</div><div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,color:"#e02044",marginTop:6}}>{fmt(worst)}</div></div>
        </div>

        {/* Add Trade */}
        <div className="card fade-up" style={{padding:"22px 26px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:17}}>Log a Trade</div>
            {formError&&<span style={{fontSize:12,color:"#e02044",fontWeight:600}}>{formError}</span>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:12,alignItems:"flex-end"}}>
            <div>{lbl("Date")}<input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
            <div>{lbl("Ticker")}<input type="text" placeholder="AAPL" value={ticker} onChange={e=>setTicker(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTrade()}/></div>
            <div>{lbl("Result ($)")}<input type="number" placeholder="120 or -45" value={result} onChange={e=>setResult(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTrade()}/></div>
            <div>{lbl("Note")}<input type="text" placeholder="Setup…" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTrade()}/></div>
            <button className="btn-primary" onClick={addTrade} disabled={saving}>{saving?"Saving…":"+ Add"}</button>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:6}}>
          {[["log","📋  Daily Log"],["chart","📊  Chart"]].map(([t,label])=>(
            <button key={t} className={`tab ${activeTab===t?"tab-active":"tab-inactive"}`} onClick={()=>setActiveTab(t)}>{label}</button>
          ))}
        </div>

        {activeTab==="chart"&&(
          <div className="card fade-up" style={{padding:"24px 26px"}}>
            <label style={{fontSize:11,color:"#8fa4d4",letterSpacing:0.8,textTransform:"uppercase",fontWeight:600,display:"block",marginBottom:16}}>Daily PNL — Last {chartDays.length} Days</label>
            {chartDays.length===0?<div style={{textAlign:"center",color:"#aab8e0",padding:"30px 0"}}>No data yet.</div>:(
              <div style={{display:"flex",alignItems:"flex-end",gap:10,height:130}}>
                {chartDays.map(d=>{const pos=d.total>=0;const h=Math.max(6,(Math.abs(d.total)/maxAbs)*110);return(
                  <div key={d.date} title={`${fmtDate(d.date)}: ${fmt(d.total)}`} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%",gap:4}}>
                    <div style={{fontSize:9,color:pos?"#0ea55a":"#e02044",fontWeight:700}}>{pos?"+":""}{(d.total/1000).toFixed(1)}k</div>
                    <div style={{width:"100%",height:h,borderRadius:pos?"6px 6px 2px 2px":"2px 2px 6px 6px",background:pos?"linear-gradient(180deg,#4fd98e,#0ea55a)":"linear-gradient(0deg,#ff6b85,#e02044)"}}/>
                    <div style={{fontSize:9,color:"#aab8e0",textAlign:"center"}}>{new Date(d.date+"T00:00:00").toLocaleDateString("en-US",{month:"numeric",day:"numeric"})}</div>
                  </div>);
                })}
              </div>
            )}
          </div>
        )}

        {activeTab==="log"&&(
          <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10}}>
            {days.length===0?<div className="card" style={{padding:"52px",textAlign:"center",color:"#aab8e0"}}>No trades yet. Log your first trade above.</div>:days.map(day=>(
              <div key={day.date} className="day-row">
                <div onClick={()=>setExpandedDay(expandedDay===day.date?null:day.date)} style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:16,alignItems:"center",padding:"16px 22px",cursor:"pointer"}}>
                  <div><div style={{fontWeight:700,fontSize:15}}>{fmtDate(day.date)}</div><div style={{fontSize:12,color:"#aab8e0",marginTop:2}}>{day.trades.length} trade{day.trades.length!==1?"s":""}</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontSize:10,color:"#aab8e0",letterSpacing:0.7,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Day PNL</div><span className={`chip ${day.total>0?"chip-pos":day.total<0?"chip-neg":"chip-zero"}`} style={{fontSize:15,padding:"5px 16px"}}>{day.total>0?"+":""}{fmt(day.total)}</span></div>
                  <div style={{width:32,height:32,borderRadius:"50%",background:"#f0f4ff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#6b85c5",transition:"transform 0.2s",transform:expandedDay===day.date?"rotate(180deg)":"none"}}>▾</div>
                </div>
                {expandedDay===day.date&&(
                  <div style={{background:"#f7f9ff",padding:"4px 22px 16px",display:"flex",flexDirection:"column",gap:7}}>
                    <div style={{display:"grid",gridTemplateColumns:"90px 130px 1fr auto",gap:12,padding:"4px 14px",fontSize:10,color:"#aab8e0",letterSpacing:0.8,fontWeight:600,textTransform:"uppercase"}}><div>Ticker</div><div>Result</div><div>Note</div><div></div></div>
                    {day.trades.map(t=>(
                      <div key={t.id} style={{display:"grid",gridTemplateColumns:"90px 130px 1fr auto",gap:12,alignItems:"center",background:"#fff",border:"1px solid #e8eeff",borderRadius:10,padding:"11px 14px",fontSize:13}}>
                        <div style={{fontWeight:700,color:"#2145e6"}}>{t.ticker||"—"}</div>
                        <span className={`chip ${t.result>0?"chip-pos":t.result<0?"chip-neg":"chip-zero"}`}>{t.result>0?"+":""}{fmt(t.result)}</span>
                        <div style={{color:"#8fa4d4",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.note||"—"}</div>
                        <button className="btn-ghost" onClick={()=>deleteTrade(t.id)}>✕ Delete</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </>}
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────
function App(){
  const [token,setToken]=useState(()=>localStorage.getItem("tl_token")||null);
  const [profile,setProfile]=useState(null);
  const [page,setPage]=useState("dashboard"); // dashboard | calculator

  const onLogin=(tok,u)=>{localStorage.setItem("tl_token",tok);setToken(tok);};
  const onLogout=()=>{localStorage.removeItem("tl_token");setToken(null);setProfile(null);};

  useEffect(()=>{
    if(!token)return;
    dbFetch("/rest/v1/profiles?select=*","GET",null,token).then(d=>{if(d?.length>0)setProfile(d[0]);}).catch(()=>{});
  },[token]);

  const downloadCSV=()=>{};

  const initials=profile?.full_name?profile.full_name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase():"?";
  const displayName=profile?.full_name||"Trader";
  const bdayStr=profile?.birthday?new Date(profile.birthday+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";

  if(!token) return <AuthScreen onLogin={onLogin}/>;

  return(
    <div style={{minHeight:"100vh",background:page==="calculator"?"#0b0e11":"#f0f4ff",fontFamily:"'Plus Jakarta Sans',sans-serif",color:"#0f1a3a"}}>
      <style>{STYLES}</style>

      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #dce6ff",padding:"0 24px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:1020,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:64}}>
          {/* Logo */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,background:"linear-gradient(135deg,#2145e6,#0f2aab)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:"#fff"}}>◈</div>
            <span style={{fontFamily:"'Instrument Serif',serif",fontSize:21}}>TradeLog</span>
          </div>

          {/* Nav */}
          <div style={{display:"flex",gap:6}}>
            <button className={`nav-tab ${page==="dashboard"?"nav-active":"nav-inactive"}`} onClick={()=>setPage("dashboard")}>📋 Dashboard</button>
            <button className={`nav-tab ${page==="calculator"?"nav-active":"nav-inactive"}`} onClick={()=>setPage("calculator")}>⚡ Calculator</button>
          </div>

          {/* Profile */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:"linear-gradient(135deg,#2145e6,#0f2aab)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>{initials}</div>
              <div style={{lineHeight:1.3}}>
                <div style={{fontWeight:700,fontSize:13,color:"#0f1a3a"}}>{displayName}</div>
                {bdayStr&&<div style={{fontSize:11,color:"#aab8e0"}}>🎂 {bdayStr}</div>}
              </div>
            </div>
            <button onClick={onLogout} style={{background:"none",border:"1.5px solid #dce6ff",color:"#6b85c5",borderRadius:9,padding:"7px 14px",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>Sign Out</button>
          </div>
        </div>
      </div>

      {page==="dashboard"&&<Dashboard token={token} profile={profile} onLogout={onLogout} downloadCSV={downloadCSV}/>}
      {page==="calculator"&&<CalcPage/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
