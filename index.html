// ── Auth refresh helper ──
const refreshToken=async()=>{
  const rt=localStorage.getItem("tl_refresh");
  if(!rt)return null;
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({refresh_token:rt})});
    const d=await res.json();
    if(d.access_token){localStorage.setItem("tl_token",d.access_token);if(d.refresh_token)localStorage.setItem("tl_refresh",d.refresh_token);return d.access_token;}
  }catch{}
  return null;
};

const dbFetch=async(path,method="GET",body=null,token=null,extra={})=>{
  const doReq=async(tok)=>{
    const h={"Content-Type":"application/json","apikey":SUPABASE_KEY,...extra};
    if(tok)h["Authorization"]=`Bearer ${tok}`;
    const r=await fetch(`${SUPABASE_URL}${path}`,{method,headers:h,body:body?JSON.stringify(body):null});
    return r;
  };
  let res=await doReq(token);
  if(res.status===401&&token){
    const nt=await refreshToken();
    if(nt){res=await doReq(nt);}
  }
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||e.error_description||"Failed");}
  const t=await res.text();return t?JSON.parse(t):null;
};

const authFetch=async(path,body)=>{
  const res=await fetch(`${SUPABASE_URL}/auth/v1${path}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify(body)});
  const d=await res.json();if(!res.ok)throw new Error(d.error_description||d.msg||"Auth failed");return d;
};

// ── COIN AUTOCOMPLETE ─────────────────────────────────────────
function CoinInput({value,onChange,usedCoins}){
  const [show,setShow]=useState(false);
  const ref=useRef();
  const suggestions=useMemo(()=>{
    if(!value)return[];
    const v=value.toUpperCase();
    const all=[...new Set([...usedCoins,...COIN_LIST])];
    return all.filter(c=>c.startsWith(v)&&c!==v).slice(0,8);
  },[value,usedCoins]);

  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setShow(false);};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);

  return(
    <div ref={ref} style={{position:"relative"}}>
      <input type="text" placeholder="BTC, ETH…" value={value}
        onChange={e=>{onChange(e.target.value.toUpperCase());setShow(true);}}
        onFocus={()=>setShow(true)}
        style={{background:"#f4f7ff",border:"1.5px solid #dce6ff",borderRadius:10,color:"#0f1a3a",fontFamily:"inherit",fontSize:14,padding:"11px 14px",width:"100%",outline:"none"}}
      />
      {show&&suggestions.length>0&&(
        <div className="suggest-box">
          {suggestions.map(c=>(
            <div key={c} className="suggest-item" onMouseDown={()=>{onChange(c);setShow(false);}}>{c}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");

  const [birthday,setBirthday]=useState("");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  const sw=m=>{setMode(m);setError("");setSuccess("");};

  const handle=async()=>{
    setError("");setSuccess("");
    if(!email||!password){setError("Enter email and password.");return;}
    if(password.length<6){setError("Password must be at least 6 characters.");return;}
    if(mode==="signup"&&!fullName.trim()){setError("Enter your full name.");return;}
    if(mode==="signup"&&!birthday){setError("Enter your birthday.");return;}
    setLoading(true);
    try{
      if(mode==="login"){
        const d=await authFetch("/token?grant_type=password",{email,password});
        localStorage.setItem("tl_refresh",d.refresh_token||"");
        onLogin(d.access_token,d.user);
      } else {
        const d=await authFetch("/signup",{email,password});
        if(d.access_token&&d.user?.id){
          localStorage.setItem("tl_refresh",d.refresh_token||"");
          await upsert("profiles",{user_id:d.user.id,full_name:fullName.trim(),birthday},d.access_token);
          onLogin(d.access_token,d.user);
        } else {setSuccess("Account created! Please sign in.");sw("login");}
      }
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#e8eeff,#f5f8ff,#dce8ff)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Plus Jakarta Sans',sans-serif",padding:"24px"}}>

          <div style={{width:52,height:52,background:"linear-gradient(135deg,#2145e6,#0f2aab)",borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:"#fff",margin:"0 auto 14px"}}>◈</div>
          <div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:"#0f1a3a"}}>TradeLog</div>
          <div style={{fontSize:13,color:"#aab8e0",marginTop:5}}>{mode==="login"?"Welcome back! Sign in to continue":"Create your TradeLog account"}</div>
        </div>
        {error&&<div style={{background:"#fff0f3",border:"1px solid #ffc5cf",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#e02044",marginBottom:16,fontWeight:600}}>{error}</div>}
        {success&&<div style={{background:"#e8fff3",border:"1px solid #a3f0c8",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#0ea55a",marginBottom:16,fontWeight:600}}>{success}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:13}}>
          {mode==="signup"&&<>
            <div><span className="lbl">Full Name</span><input type="text" placeholder="e.g. Towfiq Ahmed" value={fullName} onChange={e=>setFullName(e.target.value)}/></div>
            <div><span className="lbl">Birthday</span><input type="date" value={birthday} onChange={e=>setBirthday(e.target.value)}/></div>
          </>}
          <div><span className="lbl">Email</span><input type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/></div>
          <div><span className="lbl">Password</span><input type="password" placeholder="Min. 6 characters" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/></div>
          <button className="btn-blue" onClick={handle} disabled={loading} style={{marginTop:4}}>{loading?"Please wait…":mode==="login"?"Sign In":"Create Account"}</button>
        </div>
        <div style={{textAlign:"center",marginTop:20,fontSize:13,color:"#aab8e0"}}>
          {mode==="login"?"Don't have an account? ":"Already have an account? "}
          <span onClick={()=>sw(mode==="login"?"signup":"login")} style={{color:"#2145e6",fontWeight:700,cursor:"pointer"}}>{mode==="login"?"Sign Up":"Sign In"}</span>
        </div>
      </div>
    </div>
  );
}

// ── PROFILE PAGE ──────────────────────────────────────────────
function ProfilePage({profile,trades,token,onLogout}){
  const days=useMemo(()=>{
    const map={};
    trades.forEach(t=>{if(!map[t.date])map[t.date]={trades:[],total:0};map[t.date].trades.push(t);map[t.date].total+=parseFloat(t.result);});
    return Object.values(map);
  },[trades]);

  const totalInvested=trades.reduce((s,t)=>s+Math.abs(parseFloat(t.result)),0);
  const winDays=days.filter(d=>d.total>0).length;
  const lossDays=days.filter(d=>d.total<0).length;
  const winTrades=trades.filter(t=>parseFloat(t.result)>0).length;
  const lossTrades=trades.filter(t=>parseFloat(t.result)<0).length;
  const totalPNL=days.reduce((s,d)=>s+d.total,0);
  const bestDay=days.length?Math.max(...days.map(d=>d.total)):0;
  const worstDay=days.length?Math.min(...days.map(d=>d.total)):0;
  const avgDaily=days.length?totalPNL/days.length:0;

  // Coin stats
  const coinMap={};
  trades.forEach(t=>{const c=t.ticker||"OTHER";if(!coinMap[c])coinMap[c]={count:0,pnl:0};coinMap[c].count++;coinMap[c].pnl+=parseFloat(t.result);});
  const coinList=Object.entries(coinMap).sort((a,b)=>b[1].count-a[1].count).slice(0,6);
  const mostTraded=coinList[0]?.[0]||"—";

  const initials=profile?.full_name?profile.full_name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase():"?";
  const bdayStr=profile?.birthday?new Date(profile.birthday+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}):"—";
  const memberSince=profile?.created_at?new Date(profile.created_at).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"—";

  const statCard=(label,value,sub,color="#0f1a3a")=>(
    <div className="profile-stat">
      <div style={{fontSize:11,color:"#8fa4d4",fontWeight:600,textTransform:"uppercase",letterSpacing:0.8}}>{label}</div>
      <div style={{fontFamily:"'Instrument Serif',serif",fontSize:24,color,fontWeight:400,marginTop:2}}>{value}</div>
      {sub&&<div style={{fontSize:12,color:"#aab8e0"}}>{sub}</div>}
    </div>
  );

  return(
    <div style={{maxWidth:900,margin:"0 auto",padding:"28px 24px",display:"flex",flexDirection:"column",gap:24}} className="fade-up">
      {/* Profile Card */}
      <div className="card" style={{padding:"32px 36px",display:"flex",gap:28,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{width:80,height:80,borderRadius:"50%",background:"linear-gradient(135deg,#2145e6,#0f2aab)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:28,flexShrink:0}}>{initials}</div>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:"#0f1a3a"}}>{profile?.full_name||"Trader"}</div>
          <div style={{fontSize:13,color:"#aab8e0",marginTop:4,display:"flex",gap:16,flexWrap:"wrap"}}>
            <span>🎂 {bdayStr}</span>
            {memberSince!=="—"&&<span>📅 Member since {memberSince}</span>}
            <span>📊 {trades.length} total trades</span>
          </div>
        </div>
        <button onClick={onLogout} style={{background:"#fff0f3",border:"1px solid #ffc5cf",color:"#e02044",borderRadius:10,padding:"9px 20px",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>Sign Out</button>
      </div>

      {/* Stats Grid */}
      <div>
        <div style={{fontFamily:"'Instrument Serif',serif",fontSize:20,marginBottom:14,color:"#0f1a3a"}}>Trading Statistics</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
          {statCard("Total Trades",trades.length,`${winTrades} wins · ${lossTrades} losses`)}
          {statCard("Total PNL",fmt(totalPNL),"All time",totalPNL>=0?"#0ea55a":"#e02044")}
          {statCard("Day Win Rate",`${days.length?(winDays/days.length*100).toFixed(1):0}%`,`${winDays}W · ${lossDays}L`)}
          {statCard("Trade Win Rate",`${trades.length?(winTrades/trades.length*100).toFixed(1):0}%`,`${winTrades} profitable trades`)}
          {statCard("Best Day",fmt(bestDay),"Single day high","#0ea55a")}
          {statCard("Worst Day",fmt(worstDay),"Single day low","#e02044")}
          {statCard("Avg Daily PNL",fmt(avgDaily),"Per trading day",avgDaily>=0?"#0ea55a":"#e02044")}
          {statCard("Most Traded",mostTraded,coinList[0]?`${coinList[0][1].count} trades`:"—","#2145e6")}
        </div>
      </div>

      {/* Coin Breakdown */}
      {coinList.length>0&&(
        <div>
          <div style={{fontFamily:"'Instrument Serif',serif",fontSize:20,marginBottom:14,color:"#0f1a3a"}}>Coin Performance</div>
          <div className="card" style={{overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 80px 100px 100px",gap:12,padding:"12px 20px",fontSize:11,color:"#8fa4d4",fontWeight:600,textTransform:"uppercase",letterSpacing:0.8,borderBottom:"1px solid #f0f4ff"}}>
              <div>Coin</div><div style={{textAlign:"center"}}>Trades</div><div style={{textAlign:"right"}}>Total PNL</div><div style={{textAlign:"right"}}>Avg/Trade</div>
            </div>

              <div key={coin} style={{display:"grid",gridTemplateColumns:"1fr 80px 100px 100px",gap:12,padding:"14px 20px",borderBottom:i<coinList.length-1?"1px solid #f7f9ff":"none",alignItems:"center"}}>

                </div>
                <div style={{textAlign:"center",color:"#6b85c5",fontWeight:600}}>{data.count}</div>
                <div style={{textAlign:"right",fontWeight:700,color:data.pnl>=0?"#0ea55a":"#e02044"}}>{data.pnl>=0?"+":""}{fmt(data.pnl)}</div>
                <div style={{textAlign:"right",color:"#6b85c5",fontSize:13}}>{fmt(data.pnl/data.count)}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  const calc=useMemo(()=>{
    const e=parseFloat(entry),m=parseFloat(margin),lev=parseFloat(leverage),tp=parseFloat(tpPct),sl=parseFloat(slPct),bdt=parseFloat(bdtRate),mmR=parseFloat(mm);
    if(!e||!m||!lev)return null;
    const posSize=m*lev,qty=posSize/e,fee=posSize*0.001;
    let tpPrice=null,tpGross=null,tpNet=null,tpRetPct=null;
    if(tp){const pm=tp/lev;tpPrice=dir==="long"?e*(1+pm/100):e*(1-pm/100);tpGross=m*(tp/100);tpNet=tpGross-fee;tpRetPct=(tpNet/m)*100;}
    let slPrice=null,slGross=null,slNet=null,slRetPct=null;
    if(sl){const pm=sl/lev;slPrice=dir==="long"?e*(1-pm/100):e*(1+pm/100);slGross=-(m*(sl/100));slNet=slGross-fee;slRetPct=(slNet/m)*100;}
    const liqPrice=dir==="long"?e*(1-1/lev+mmR/100):e*(1+1/lev-mmR/100);
    const rr=(tp&&sl)?`1 : ${(tp/sl).toFixed(2)}`:"—";
    return{posSize,qty,liqPrice,tpPrice,tpGross,tpNet,tpRetPct,slPrice,slGross,slNet,slRetPct,rr,bdt,fee};
  },[dir,entry,margin,leverage,tpPct,slPct,bdtRate,mm]);

  const applyRatio=()=>{const s=parseFloat(slPct);if(s>0){setTpPct((s*3).toFixed(2));return;}const t=parseFloat(tpPct);if(t>0)setSlPct((t/3).toFixed(2));};
  const fN=(n,d=2)=>n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:d});
  const fP=n=>n==null?"—":n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:6});

  return(
    <div style={{background:"#0b0e11",minHeight:"100vh",padding:"24px",fontFamily:"'Plus Jakarta Sans',sans-serif"}}>
      <div style={{maxWidth:1000,margin:"0 auto"}}>
        <h2 style={{textAlign:"center",color:"#f0b90b",fontFamily:"'Instrument Serif',serif",fontSize:26,marginBottom:6}}>⚡ Binance Futures PnL Calculator</h2>
        <p style={{textAlign:"center",color:"#848e9c",marginBottom:24,fontSize:13}}>Input PnL % on Margin → Get Platform Price, Gross & Net PnL, BDT</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
          <div className="calc-card">
            <div style={{fontWeight:700,color:"#eaecef",marginBottom:16,fontSize:15}}>📊 Trade Setup</div>
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              <button className={`dir-btn ${dir==="long"?"long-active":""}`} onClick={()=>setDir("long")}>LONG</button>
              <button className={`dir-btn ${dir==="short"?"short-active":""}`} onClick={()=>setDir("short")}>SHORT</button>
            </div>
            {[["Entry Price (USDT)",entry,setEntry,"e.g. 65000"],["Initial Margin (USDT)",margin,setMargin,"e.g. 100"]].map(([l,v,s,p])=>(
              <div key={l} style={{marginBottom:14}}>
                <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>{l}</label>
                <input type="number" className="calc-input" placeholder={p} value={v} onChange={e=>s(e.target.value)}/>
              </div>
            ))}
            <div style={{marginBottom:14}}>
              <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>Leverage</label>
              <div style={{textAlign:"center",fontSize:20,fontWeight:700,color:"#f0b90b",marginBottom:6}}>{leverage}x</div>
              <input type="range" min="1" max="125" value={leverage} onChange={e=>setLeverage(e.target.value)}/>
            </div>
            <div style={{background:"rgba(240,185,11,0.1)",border:"1px solid #f0b90b",borderRadius:8,padding:"11px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:13,color:"#f0b90b"}}>⚠️ Recommended R:R = 1:3</span>
              <button onClick={applyRatio} style={{background:"#f0b90b",color:"#000",border:"none",padding:"6px 14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>Auto Fix</button>
            </div>
            {[["Target PnL % (Return on Margin)",tpPct,setTpPct,"e.g. 150"],["Max Loss % (Risk on Margin)",slPct,setSlPct,"e.g. 50"],["USDT to BDT Rate",bdtRate,setBdtRate,"e.g. 110"],["Maintenance Margin (%)",mm,setMm,"0.5"]].map(([l,v,s,p])=>(
              <div key={l} style={{marginBottom:14}}>
                <label style={{display:"block",marginBottom:6,fontSize:13,color:"#848e9c",fontWeight:600}}>{l}</label>
                <input type="number" className="calc-input" placeholder={p} value={v} onChange={e=>s(e.target.value)}/>
              </div>
            ))}
          </div>
          <div className="calc-card">
            <div style={{fontWeight:700,color:"#eaecef",marginBottom:16,fontSize:15}}>📈 Position Details</div>
            {[["Direction",<span style={{color:dir==="long"?"#0ecb81":"#f6465d",fontWeight:700}}>{dir.toUpperCase()}</span>],["Position Size",calc?`${fN(calc.posSize)} USDT`:"—"],["Quantity (Coins)",calc?fN(calc.qty,6):"—"],["Risk/Reward Ratio",calc?calc.rr:"—"]].map(([l,v])=>(
              <div key={l} className="res-row"><span style={{color:"#848e9c",fontSize:14}}>{l}</span><span style={{fontWeight:700,fontSize:14,color:"#eaecef"}}>{v}</span></div>
            ))}
            <div className="liq-banner">
              <span style={{fontSize:13,color:"#f6465d",fontWeight:700}}>💧 Liquidation Price</span>
              <span style={{fontSize:18,fontWeight:700,color:"#f6465d",fontFamily:"monospace"}}>{calc?fP(calc.liqPrice):"—"}</span>
            </div>
            <div className="scen-tp">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:"#0ecb81",fontWeight:700,fontSize:13}}>🎯 Take Profit</span>
                <span style={{color:"#f0b90b",fontWeight:700,fontSize:13}}>{tpPct?`${(tpPct/leverage).toFixed(3)}% move`:"—"}</span>
              </div>
              <div className="plat-price">
                <div style={{fontSize:11,color:"#f0b90b",textTransform:"uppercase",letterSpacing:0.5}}>Platform Price (Set on Binance)</div>
                <div style={{fontSize:20,fontWeight:700,color:"#f0b90b",fontFamily:"monospace"}}>{calc&&calc.tpPrice?fP(calc.tpPrice):"—"}</div>
              </div>
              {[["Gross PnL",calc&&calc.tpGross!=null?`+${fN(calc.tpGross)} USDT`:"—","#0ecb81"],["Net PnL (after fees)",calc&&calc.tpNet!=null?`+${fN(calc.tpNet)} USDT`:"—","#0ecb81"],["Return on Margin",calc&&calc.tpRetPct!=null?`+${fN(calc.tpRetPct)}%`:"—","#0ecb81"]].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:13}}>
                  <span style={{color:"#848e9c"}}>{l}</span><span style={{fontWeight:700,color:c,fontFamily:"monospace"}}>{v}</span>
                </div>
              ))}
              {calc?.tpNet&&<div style={{fontSize:11,color:"#848e9c",textAlign:"right",marginTop:4}}>{fN(calc.tpNet*bdtRate)} BDT</div>}
            </div>
            <div className="scen-sl">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:"#f6465d",fontWeight:700,fontSize:13}}>🛑 Stop Loss</span>
                <span style={{color:"#f0b90b",fontWeight:700,fontSize:13}}>{slPct?`${(slPct/leverage).toFixed(3)}% move`:"—"}</span>
              </div>
              <div className="plat-price">
                <div style={{fontSize:11,color:"#f0b90b",textTransform:"uppercase",letterSpacing:0.5}}>Platform Price (Set on Binance)</div>
                <div style={{fontSize:20,fontWeight:700,color:"#f0b90b",fontFamily:"monospace"}}>{calc&&calc.slPrice?fP(calc.slPrice):"—"}</div>
              </div>
              {[["Gross PnL",calc&&calc.slGross!=null?`${fN(calc.slGross)} USDT`:"—","#f6465d"],["Net PnL (after fees)",calc&&calc.slNet!=null?`${fN(calc.slNet)} USDT`:"—","#f6465d"],["Return on Margin",calc&&calc.slRetPct!=null?`${fN(calc.slRetPct)}%`:"—","#f6465d"]].map(([l,v,c])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",fontSize:13}}>
                  <span style={{color:"#848e9c"}}>{l}</span><span style={{fontWeight:700,color:c,fontFamily:"monospace"}}>{v}</span>
                </div>
              ))}
              {calc?.slNet&&<div style={{fontSize:11,color:"#848e9c",textAlign:"right",marginTop:4}}>{fN(calc.slNet*bdtRate)} BDT</div>}
            </div>
            <div style={{fontSize:11,color:"#848e9c",textAlign:"center",marginTop:10,fontStyle:"italic"}}>*Fees estimated at 0.1% round-trip on Position Size</div>
          </div>
        </div>
        <div style={{background:"#1e2329",border:"1px solid #2b3139",borderRadius:12,padding:"14px 18px",marginTop:20,fontSize:12,color:"#848e9c",lineHeight:1.7}}>
          <strong style={{color:"#eaecef"}}>How the math works:</strong> PnL % on Margin → Price Move % = PnL % ÷ Leverage → Platform Price = Entry × (1 ± Price Move %) → Gross PnL = Margin × (PnL% / 100) → Net PnL = Gross − Fees.<br/>
          <em>Disclaimer: Educational estimate. Actual Binance fees, funding, and margin tiers may vary.</em>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({token}){
  const [trades,setTrades]=useState([]);
  const [startCap,setStartCap]=useState(10000);
  const [capEdit,setCapEdit]=useState(false);
  const [capInput,setCapInput]=useState("");
  const [loadingData,setLoadingData]=useState(false);
  const [date,setDate]=useState(todayStr());
  const [ticker,setTicker]=useState("");
  const [direction,setDirection]=useState("long");
  const [result,setResult]=useState("");
  const [formError,setFormError]=useState("");
  const [saving,setSaving]=useState(false);
  const [expandedDay,setExpandedDay]=useState(null);
  const [activeTab,setActiveTab]=useState("log");

  const usedCoins=useMemo(()=>[...new Set(trades.map(t=>t.ticker).filter(Boolean))],[trades]);

  const getToken=useCallback(async()=>{
    const stored=localStorage.getItem("tl_token");
    if(!stored)return null;
    // Try to use stored, if expired refresh
    return stored;
  },[]);

  const fetchData=useCallback(async()=>{
    setLoadingData(true);
    try{
      const tok=localStorage.getItem("tl_token");
      const [td,sd]=await Promise.all([
        dbFetch("/rest/v1/trades?select=*&order=date.desc,created_at.desc","GET",null,tok),
        dbFetch("/rest/v1/user_settings?select=*","GET",null,tok),
      ]);
      setTrades(td||[]);
      if(sd?.length>0)setStartCap(parseFloat(sd[0].starting_capital));
    }catch(e){console.error(e);}
    finally{setLoadingData(false);}
  },[]);

  useEffect(()=>{fetchData();},[fetchData]);

  const addTrade=async()=>{
    const r=parseFloat(result);
    if(isNaN(r)){setFormError("Enter a valid result.");return;}
    if(!ticker.trim()){setFormError("Enter a ticker.");return;}
    setFormError("");setSaving(true);
    try{
      const tok=localStorage.getItem("tl_token");
      const uid=JSON.parse(atob(tok.split(".")[1])).sub;
      const row=await dbFetch("/rest/v1/trades","POST",{user_id:uid,date,ticker:ticker.trim().toUpperCase(),result:r,note:direction},tok,{"Prefer":"return=representation"});
      setTrades(prev=>[row[0],...prev]);
      setTicker("");setResult("");
    }catch(e){setFormError(e.message);}
    finally{setSaving(false);}
  };

  const deleteTrade=async(id)=>{
    try{
      const tok=localStorage.getItem("tl_token");
      await dbFetch(`/rest/v1/trades?id=eq.${id}`,"DELETE",null,tok);
      setTrades(prev=>prev.filter(t=>t.id!==id));
    }catch(e){alert("Delete failed: "+e.message);}
  };

  const saveCapital=async()=>{
    const v=parseFloat(capInput);
    if(isNaN(v)||v<=0)return;
    try{
      const tok=localStorage.getItem("tl_token");
      const uid=JSON.parse(atob(tok.split(".")[1])).sub;
      await upsert("user_settings",{user_id:uid,starting_capital:v},tok);
      setStartCap(v);setCapEdit(false);
    }catch(e){alert("Could not save: "+e.message);}
  };

  // CSV Download
  const downloadCSV=()=>{
    const rows=[["Date","Ticker","Direction","Result ($)"]];
    [...trades].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
      rows.push([t.date,t.ticker||"",t.note||"",t.result]);
    });
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`tradelog_${todayStr()}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  const days=useMemo(()=>{
    const map={};
    trades.forEach(t=>{if(!map[t.date])map[t.date]={date:t.date,trades:[],total:0};map[t.date].trades.push(t);map[t.date].total+=parseFloat(t.result);});
    return Object.values(map).sort((a,b)=>b.date.localeCompare(a.date));
  },[trades]);

  const totalPNL=days.reduce((s,d)=>s+d.total,0);
  const currentCap=startCap+totalPNL;
  const capPct=((currentCap-startCap)/startCap*100);
  const winDays=days.filter(d=>d.total>0).length;
  const lossDays=days.filter(d=>d.total<0).length;
  const winRate=days.length?(winDays/days.length*100).toFixed(1):"0.0";
  const best=days.length?Math.max(...days.map(d=>d.total)):0;
  const worst=days.length?Math.min(...days.map(d=>d.total)):0;

  // Monthly chart data
  const monthlyData=useMemo(()=>{
    const map={};
    trades.forEach(t=>{
      const m=t.date.slice(0,7); // YYYY-MM
      if(!map[m])map[m]={month:m,total:0};
      map[m].total+=parseFloat(t.result);
    });
    return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).slice(-12);
  },[trades]);

  const maxAbsMonth=Math.max(...monthlyData.map(d=>Math.abs(d.total)),1);

  const fmtMonth=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1).toLocaleDateString("en-US",{month:"short",year:"2-digit"});};

  return(
    <div style={{maxWidth:1020,margin:"0 auto",padding:"24px",display:"flex",flexDirection:"column",gap:20}}>
      {/* CSV Button */}
      <div style={{display:"flex",justifyContent:"flex-end"}}>
        <button onClick={downloadCSV} style={{background:"#fff",color:"#2145e6",border:"1.5px solid #2145e6",borderRadius:10,padding:"9px 20px",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>⬇ Download CSV</button>
      </div>

      {loadingData&&<div style={{textAlign:"center",padding:"40px",color:"#aab8e0"}}>Loading your trades…</div>}
      {!loadingData&&<>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14}} className="fade-up">
          <div style={{background:"linear-gradient(135deg,#1a3fd4,#0f2aab)",borderRadius:18,color:"#fff",padding:"24px 26px"}}>
            <div style={{fontSize:11,letterSpacing:1,opacity:0.55,fontWeight:600,textTransform:"uppercase",marginBottom:8}}>Current Capital</div>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:32,letterSpacing:"-1px",lineHeight:1}}>{fmt(currentCap)}</div>
            <div style={{marginTop:10}}><span style={{fontSize:12,background:capPct>=0?"rgba(255,255,255,0.18)":"rgba(255,60,80,0.3)",borderRadius:7,padding:"4px 10px",fontWeight:700}}>{capPct>=0?"▲":"▼"} {Math.abs(capPct).toFixed(2)}%</span></div>
            <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.12)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:10,opacity:0.5,textTransform:"uppercase"}}>Starting</div><div style={{fontWeight:700,fontSize:15,marginTop:2}}>{fmt(startCap)}</div></div>
              <button onClick={()=>{setCapEdit(!capEdit);setCapInput(startCap.toString());}} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:11,fontFamily:"inherit",fontWeight:700}}>{capEdit?"CANCEL":"EDIT"}</button>
            </div>
            {capEdit&&(
              <div style={{marginTop:10,display:"flex",gap:8}}>
                <input type="number" value={capInput} onChange={e=>setCapInput(e.target.value)} placeholder="New starting capital" style={{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.25)",color:"#fff",flex:1,borderRadius:8,padding:"9px 12px",outline:"none",fontFamily:"inherit",fontSize:14}}/>
                <button onClick={saveCapital} style={{background:"#fff",color:"#1a3fd4",border:"none",borderRadius:8,padding:"9px 14px",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>SAVE</button>
              </div>
            )}
          </div>
          <div className="card" style={{padding:"22px"}}><span className="lbl">Total PNL</span><div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:totalPNL>=0?"#0ea55a":"#e02044"}}>{totalPNL>=0?"+":""}{fmt(totalPNL)}</div><div style={{marginTop:8,fontSize:12,color:"#aab8e0"}}>{trades.length} trades · {days.length} days</div></div>
          <div className="card" style={{padding:"22px"}}><span className="lbl">Day Win Rate</span><div style={{fontFamily:"'Instrument Serif',serif",fontSize:28}}>{winRate}%</div><div style={{marginTop:8,display:"flex",gap:10}}><span style={{fontSize:13,color:"#0ea55a",fontWeight:700}}>▲ {winDays}W</span><span style={{fontSize:13,color:"#e02044",fontWeight:700}}>▼ {lossDays}L</span></div></div>
          <div className="card" style={{padding:"22px"}}><span className="lbl">Best / Worst Day</span><div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,color:"#0ea55a"}}>+{fmt(best)}</div><div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,color:"#e02044",marginTop:6}}>{fmt(worst)}</div></div>
        </div>

        {/* Add Trade */}
        <div className="card fade-up" style={{padding:"22px 26px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:17}}>Log a Trade</div>
            {formError&&<span style={{fontSize:12,color:"#e02044",fontWeight:600}}>{formError}</span>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"140px 1fr 1fr 140px 1fr auto",gap:12,alignItems:"flex-end"}}>
            <div><span className="lbl">Date</span><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
            <div><span className="lbl">Ticker</span><CoinInput value={ticker} onChange={setTicker} usedCoins={usedCoins}/></div>
            <div><span className="lbl">Direction</span>
              <select value={direction} onChange={e=>setDirection(e.target.value)} style={{background:"#f4f7ff",border:"1.5px solid #dce6ff",borderRadius:10,color:direction==="long"?"#2145e6":"#e02044",fontFamily:"inherit",fontSize:14,padding:"11px 14px",width:"100%",outline:"none",fontWeight:700}}>
                <option value="long">🟢 LONG</option>
                <option value="short">🔴 SHORT</option>
              </select>
            </div>
            <div><span className="lbl">Result ($)</span><input type="number" placeholder="120 or -45" value={result} onChange={e=>setResult(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTrade()}/></div>
            <div style={{display:"flex",alignItems:"flex-end"}}><button className="btn-primary" onClick={addTrade} disabled={saving} style={{width:"100%"}}>{saving?"Saving…":"+ Add Trade"}</button></div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:6}}>
          {[["log","📋 Daily Log"],["chart","📊 Monthly Chart"]].map(([t,label])=>(
            <button key={t} className={`tab ${activeTab===t?"tab-active":"tab-inactive"}`} onClick={()=>setActiveTab(t)}>{label}</button>
          ))}
        </div>

        {/* Monthly Chart */}
        {activeTab==="chart"&&(
          <div className="card fade-up" style={{padding:"24px 26px"}}>
            <div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,marginBottom:4}}>Monthly PNL Overview</div>
            <div style={{fontSize:12,color:"#aab8e0",marginBottom:20}}>Last {monthlyData.length} months</div>
            {monthlyData.length===0?<div style={{textAlign:"center",color:"#aab8e0",padding:"30px 0"}}>No data yet.</div>:(
              <>
                <div style={{display:"flex",alignItems:"flex-end",gap:8,height:160,marginBottom:12}}>
                  {monthlyData.map(d=>{
                    const pos=d.total>=0;const h=Math.max(8,(Math.abs(d.total)/maxAbsMonth)*140);
                    return(
                      <div key={d.month} title={`${fmtMonth(d.month)}: ${fmt(d.total)}`} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%",gap:4}}>
                        <div style={{fontSize:10,color:pos?"#0ea55a":"#e02044",fontWeight:700,whiteSpace:"nowrap"}}>{pos?"+":""}{fmt(d.total).replace("$","$").replace(",","").length>8?`${(d.total/1000).toFixed(1)}k`:fmt(d.total)}</div>
                        <div style={{width:"100%",height:h,borderRadius:pos?"8px 8px 2px 2px":"2px 2px 8px 8px",background:pos?"linear-gradient(180deg,#4fd98e,#0ea55a)":"linear-gradient(0deg,#ff6b85,#e02044)",transition:"height 0.3s"}}/>
                        <div style={{fontSize:10,color:"#aab8e0",textAlign:"center",fontWeight:500}}>{fmtMonth(d.month)}</div>
                      </div>
                    );
                  })}
                </div>
                {/* Month summary row */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginTop:8}}>

                    <div key={d.month} style={{background:"#f7f9ff",borderRadius:10,padding:"10px 14px",border:"1px solid #e8eeff"}}>
                      <div style={{fontSize:11,color:"#aab8e0",fontWeight:600}}>{fmtMonth(d.month)}</div>
                      <div style={{fontWeight:700,fontSize:16,color:d.total>=0?"#0ea55a":"#e02044",marginTop:2}}>{d.total>=0?"+":""}{fmt(d.total)}</div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        )}

        {/* Daily Log */}
        {activeTab==="log"&&(
          <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10}}>
            {days.length===0?<div className="card" style={{padding:"52px",textAlign:"center",color:"#aab8e0"}}>No trades yet. Log your first trade above.</div>:days.map(day=>(
              <div key={day.date} className="day-row">
                <div onClick={()=>setExpandedDay(expandedDay===day.date?null:day.date)} style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:16,alignItems:"center",padding:"16px 22px",cursor:"pointer"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{fmtDate(day.date)}</div>
                    <div style={{fontSize:12,color:"#aab8e0",marginTop:2}}>{day.trades.length} trade{day.trades.length!==1?"s":""}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:10,color:"#aab8e0",letterSpacing:0.7,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>Day PNL</div>
                    <span className={`chip ${day.total>0?"chip-pos":day.total<0?"chip-neg":"chip-zero"}`} style={{fontSize:15,padding:"5px 16px"}}>{day.total>0?"+":""}{fmt(day.total)}</span>
                  </div>
                  <div style={{width:32,height:32,borderRadius:"50%",background:"#f0f4ff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#6b85c5",transition:"transform 0.2s",transform:expandedDay===day.date?"rotate(180deg)":"none"}}>▾</div>
                </div>
                {expandedDay===day.date&&(
                  <div style={{background:"#f7f9ff",padding:"4px 22px 16px",display:"flex",flexDirection:"column",gap:7}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 80px 120px 80px",gap:12,padding:"4px 14px",fontSize:10,color:"#aab8e0",letterSpacing:0.8,fontWeight:600,textTransform:"uppercase"}}><div>Ticker</div><div>Direction</div><div>Result</div><div></div></div>
                    {day.trades.map(t=>(
                      <div key={t.id} style={{display:"grid",gridTemplateColumns:"1fr 80px 120px 80px",gap:12,alignItems:"center",background:"#fff",border:"1px solid #e8eeff",borderRadius:10,padding:"11px 14px",fontSize:13}}>
                        <div style={{fontWeight:700,color:"#2145e6"}}>{t.ticker||"—"}</div>
                        <div><span className={t.note==="long"?"chip-long":"chip-short"}>{t.note==="long"?"▲ LONG":"▼ SHORT"}</span></div>
                        <span className={`chip ${parseFloat(t.result)>0?"chip-pos":parseFloat(t.result)<0?"chip-neg":"chip-zero"}`}>{parseFloat(t.result)>0?"+":""}{fmt(t.result)}</span>
                        <button className="btn-ghost" onClick={()=>deleteTrade(t.id)}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </>}
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────
function App(){
  const [token,setToken]=useState(()=>localStorage.getItem("tl_token")||null);
  const [profile,setProfile]=useState(null);
  const [trades,setTrades]=useState([]);
  const [page,setPage]=useState("dashboard");

  const onLogin=(tok)=>{localStorage.setItem("tl_token",tok);setToken(tok);};
  const onLogout=()=>{localStorage.removeItem("tl_token");localStorage.removeItem("tl_refresh");setToken(null);setProfile(null);setPage("dashboard");};

  useEffect(()=>{
    if(!token)return;
    const tok=localStorage.getItem("tl_token");
    Promise.all([
      dbFetch("/rest/v1/profiles?select=*","GET",null,tok),
      dbFetch("/rest/v1/trades?select=*&order=date.desc,created_at.desc","GET",null,tok),
    ]).then(([p,t])=>{
      if(p?.length>0)setProfile(p[0]);
      setTrades(t||[]);
    }).catch(()=>{});
  },[token]);

  const initials=profile?.full_name?profile.full_name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase():"?";
  const displayName=profile?.full_name||"Trader";
  const bdayStr=profile?.birthday?new Date(profile.birthday+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";

  if(!token)return <AuthScreen onLogin={onLogin}/>;

  return(
    <div style={{minHeight:"100vh",background:page==="calculator"?"#0b0e11":"#f0f4ff",fontFamily:"'Plus Jakarta Sans',sans-serif",color:"#0f1a3a"}}>
      <style>{STYLES}</style>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #dce6ff",padding:"0 20px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:1020,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <div style={{width:32,height:32,background:"linear-gradient(135deg,#2145e6,#0f2aab)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,color:"#fff"}}>◈</div>
            <span style={{fontFamily:"'Instrument Serif',serif",fontSize:20}}>TradeLog</span>
          </div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {[["dashboard","📋 Dashboard"],["calculator","⚡ Calculator"],["profile","👤 Profile"]].map(([p,label])=>(
              <button key={p} className={`nav-tab ${page===p?"nav-active":"nav-inactive"}`} onClick={()=>setPage(p)} style={{fontSize:12,padding:"7px 14px"}}>{label}</button>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <div style={{width:34,height:34,borderRadius:"50%",background:"linear-gradient(135deg,#2145e6,#0f2aab)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:12,flexShrink:0,cursor:"pointer"}} onClick={()=>setPage("profile")}>{initials}</div>
            <div style={{lineHeight:1.2,cursor:"pointer"}} onClick={()=>setPage("profile")}>
              <div style={{fontWeight:700,fontSize:13,color:"#0f1a3a"}}>{displayName}</div>
              {bdayStr&&<div style={{fontSize:10,color:"#aab8e0"}}>🎂 {bdayStr}</div>}
            </div>
          </div>
        </div>
      </div>

      {page==="dashboard"&&<Dashboard token={token}/>}
      {page==="calculator"&&<CalcPage/>}
      {page==="profile"&&<ProfilePage profile={profile} trades={trades} token={token} onLogout={onLogout}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
